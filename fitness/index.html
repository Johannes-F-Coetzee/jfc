<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Tracker</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://forms.googleapis.com https://docs.google.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; form-action https://docs.google.com; base-uri 'self'; object-src 'none'">
  <meta name="theme-color" content="#2b1d1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="exercise_favicon.svg" type="image/svg+xml">
  <script src="settings.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="shared-header.js" defer></script>
  <script src="pwa.js" defer></script>
  <script src="connectivity.js" defer></script>
  <script src="utilities.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="google-forms.js" defer></script>
  <script src="submission-status.js" defer></script>
  <script src="routines.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <header id="fitness-header" class="topbar" data-page="log"></header>

  <main>
    <section id="setup-warning" class="card warning" hidden></section>

    <section id="login-view" class="card center">
      <h2>Sign in</h2>
      <p>Sign in with your Google account to log your workouts.</p>
      <div id="google-signin-button"></div>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="tracker-view" hidden>
      <form id="workout-form" class="card" novalidate>
        <div class="grid">
          <label class="field">Date
            <input type="date" id="workout-date" required>
          </label>
          <div class="field">
            <label id="routine-label" for="routine-name">Routine</label>
            <span class="routine-picker">
              <select id="routine-select" aria-labelledby="routine-label" hidden></select>
              <span id="routine-capture" class="routine-capture">
                <input id="routine-name" aria-labelledby="routine-label" placeholder="e.g. Upper body A" autocomplete="off">
                <button type="button" id="clear-routine-name" class="icon-btn" aria-label="Clear routine name"
                  title="Clear routine name">&times;</button>
              </span>
            </span>
            <button type="button" id="choose-saved-routine" class="btn link" hidden>Choose a saved routine</button>
          </div>
        </div>
        <details id="routine-actions" class="actions-menu">
          <summary class="btn ghost small">Routine actions</summary>
          <div class="actions-panel card">
            <button type="button" id="refresh-routines" class="btn ghost small">Refresh routines</button>
            <button type="button" id="save-routine" class="btn ghost small">Save as routine</button>
            <button type="button" id="export-routine" class="btn ghost small"
              title="Download all shared routines in the routines.json format">Export routines (JSON)</button>
          </div>
        </details>
        <p id="routine-status" class="status" role="status" aria-live="polite"></p>

        <div id="exercises"></div>
        <datalist id="exercise-names"></datalist>

        <button type="button" id="add-exercise" class="btn secondary">+ Add exercise</button>

        <label class="field">Session notes
          <textarea id="session-notes" rows="2" placeholder="How did the session feel overall?"></textarea>
        </label>

        <div class="submit-row">
          <button type="submit" id="submit-workout" class="btn primary">Submit workout</button>
          <span id="estimated-time" class="estimate"
            title="Timed sets as entered, 10 s per rep, 1 min rest between sets">
            Est. time <strong id="estimated-time-value">0:00</strong>
          </span>
        </div>
        <div class="clear-row">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button type="button" id="undo-clear" class="btn link" hidden>Undo</button>
          <button type="button" id="clear-workout" class="btn link">Clear workout</button>
        </div>
        <div id="queue-box" class="queue" hidden>
          <span id="queue-text"></span>
          <button type="button" id="retry-queue" class="btn ghost small">Retry now</button>
        </div>
      </form>

      <section class="card">
        <h2>Recent workouts <small>(this device)</small></h2>
        <ul id="history" class="history"></ul>
        <div class="row-actions">
          <button type="button" id="export-local-data" class="btn ghost small">Export my data</button>
          <button type="button" id="import-local-data" class="btn ghost small">Import data</button>
          <input type="file" id="import-local-file" accept="application/json,.json" hidden aria-label="Choose a workout data file to import">
        </div>
      </section>
    </section>
  </main>

  <template id="exercise-template">
    <article class="exercise" data-measure="reps">
      <div class="exercise-head">
        <input class="ex-name" placeholder="Exercise (e.g. Push-ups)" list="exercise-names" aria-label="Exercise name"
          autocomplete="off">
        <select class="ex-measure" aria-label="Measure">
          <option value="reps">Reps</option>
          <option value="time">Time</option>
        </select>
        <button type="button" class="icon-btn ex-remove" title="Remove exercise"
          aria-label="Remove exercise">&times;</button>
      </div>
      <div class="sets"></div>
      <button type="button" class="btn ghost small ex-add-set">+ Add set</button>
    </article>
  </template>

  <template id="set-template">
    <div class="set">
      <span class="set-no"></span>
      <label class="field reps-field">Reps
        <input class="set-reps" type="number" min="0" step="1" inputmode="numeric">
      </label>
      <label class="field time-field">Time (m:ss)
        <span class="time-input">
          <input class="set-time" placeholder="0:45" inputmode="numeric" autocomplete="off">
          <button type="button" class="btn small set-timer" title="Start/stop timer">&#9654;</button>
        </span>
      </label>
      <label class="field weight-field"><span class="weight-label">Weight (kg)</span>
        <input class="set-weight" type="number" min="0" step="any" inputmode="decimal">
      </label>
      <label class="field rpe-field">Difficulty
        <select class="set-rpe"></select>
      </label>
      <label class="field notes-field" hidden>Notes
        <input class="set-notes" autocomplete="off">
      </label>
      <button type="button" class="btn link set-add-note">+ Note</button>
      <button type="button" class="icon-btn set-remove" title="Remove set" aria-label="Remove set">&times;</button>
    </div>
  </template>
</body>

</html>
